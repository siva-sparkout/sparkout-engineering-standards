# pyproject.toml
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "C4",          # comprehensions
  "C90",         # mccabe complexity
  "S",           # bandit (security)
  "T20",         # no print()
  "BLE",         # no blind except
  "ASYNC",       # async correctness — section 14
  "PL",          # pylint subset
  "RUF",
]
ignore = ["E501"]           # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**"      = ["S101"]  # assert is the point of a test
"app/env.py"    = ["S105"]  # settings field names look like secrets to bandit
"scripts/**"    = ["T20"]   # print is fine in a script

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
# Existing untyped modules are listed here and removed as they are typed.
[[tool.mypy.overrides]]
module = ["app.legacy.*"]
ignore_errors = true
